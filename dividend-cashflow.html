<main>
  <h1>股息與現金流規劃</h1>
  <p class="subtitle">規劃配息現金流與稅務、退休提領的試算工具，陸續開發中</p>

  <div class="tool-grid">
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">📅</div>
      <h3>月配息現金流月曆</h3>
      <p>輸入持股清單與配息月份，試算每個月預期能收到多少股息，適合存股族。</p>
    </div>
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">🧾</div>
      <h3>可扣抵稅額／股利所得稅試算</h3>
      <p>台股股利併入綜所稅計算，判斷用哪種課稅方式較划算。</p>
    </div>
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">🏖️</div>
      <h3>退休提領試算（4%法則）</h3>
      <p>輸入退休資產與提領率，估算能撐幾年、每月可提領多少。</p>
    </div>
  </div>
</main>
