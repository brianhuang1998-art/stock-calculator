<div class="topbar">
  <span class="dot"></span>
  <span class="brand">Brian工作室</span>
</div>
<div class="subbar">
  <b>🏠 首頁</b>
</div>

<main>
  <div class="hero">
    <span class="eyebrow">Brian工作室</span>
    <h1>Brian 投資工具箱</h1>
    <p>整理一些自己在投資與生活上會用到的小工具，之後會陸續擴充。</p>
  </div>

  <div class="tool-grid">
    <a class="tool-card" href="brian-tools.html">
      <div class="icon">🛠</div>
      <h3>進入 試算</h3>
      <p>查看ETF 、個股損益試算機與目標%價格。</p>
      <div class="go">前往試算列表 →</div>
    </a>
    <a class="tool-card" href="trading-position.html">
      <div class="icon">📊</div>
      <h3>交易與部位管理</h3>
      <p>定期定額複利、部位大小、加權成本與再平衡等試算工具。</p>
      <div class="go">前往工具列表 →</div>
    </a>
    <a class="tool-card" href="valuation-analysis.html">
      <div class="icon">🔍</div>
      <h3>估值與基本面分析</h3>
      <p>本益比河流圖、DDM／DCF估值、ROE杜邦拆解等分析工具。</p>
      <div class="go">前往工具列表 →</div>
    </a>
    <a class="tool-card" href="dividend-cashflow.html">
      <div class="icon">💰</div>
      <h3>股息與現金流規劃</h3>
      <p>月配息現金流月曆、股利稅務、退休提領試算等工具。</p>
      <div class="go">前往工具列表 →</div>
    </a>
  </div>
