  <a href="home_page.html">🏠 首頁</a><span>›</span><b>估值與基本面分析</b>

<main>
  <h1>估值與基本面分析</h1>
  <p class="subtitle">評估股價合理性與獲利品質的分析工具，陸續開發中</p>

  <div class="tool-grid">
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">🌊</div>
      <h3>本益比／股價淨值比河流圖</h3>
      <p>輸入歷史EPS或淨值與目前股價，畫出目前站在歷史區間的哪個百分位。</p>
    </div>
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">💹</div>
      <h3>股利折現模型（DDM）試算</h3>
      <p>輸入股利、成長率、折現率，估算合理股價。</p>
    </div>
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">📐</div>
      <h3>DCF現金流折現試算</h3>
      <p>輸入自由現金流與成長假設，估算內在價值，適合看現金流穩定的公司。</p>
    </div>
    <div class="tool-card soon">
      <span class="badge muted corner">開發中</span>
      <div class="icon">🧩</div>
      <h3>ROE杜邦分析拆解</h3>
      <p>把ROE拆成淨利率×資產周轉率×財務槓桿，快速看出獲利品質來源。</p>
    </div>
  </div>
</main>
